<script>
  function lbPollI18n(key, fallback) {
    try {
      var i18n = window.LB && window.LB.i18n;
      var lang = window.LB && window.LB.settings && window.LB.settings.language;
      if (i18n && lang && i18n[lang] && i18n[lang][key]) {
        return i18n[lang][key];
      }
      if (i18n && i18n.af && i18n.af[key]) {
        return i18n.af[key];
      }
    } catch (e) {}
    return fallback;
  }

  function getTotalVotes(poll, pollId) {
    let elementId = `total-votes-${pollId}`;
    let totalVotes = poll.answers.reduce((acc, ans) => acc + ans.votes, 0);
    document.getElementById(elementId).innerText = totalVotes;
  }

  function getTimeLeft(poll, pollId) {
    let elementId = `vote-end-${pollId}`;
    let buttonId = `vote-button-${pollId}`;

    if (typeof window.moment === 'function') {
      var lang = (window.LB && window.LB.settings && window.LB.settings.language) || 'en';
      if (window.moment.locale) {
        window.moment.locale(lang);
      }
      let now = window.moment();
      let activeUntil = window.moment(poll.active_until);
      let timeLeft = activeUntil.fromNow();

      if (activeUntil.isBefore(now)) {
        document.getElementById(elementId).innerText = lbPollI18n('Poll closed', 'Poll closed');
        document.getElementById(buttonId).style.display = 'none';
      } else {
        var endsLabel = lbPollI18n('Ends', 'Ends');
        document.getElementById(elementId).innerText = endsLabel + ' ' + timeLeft;
      }
    }
  }

  function placeVote(event, form) {
    event.preventDefault();
    var formData = new FormData(form);

    var data = {};
    for (var pair of formData.entries()) {
      data[pair[0]] = pair[1];
    }

    var voteEvent = new CustomEvent('place_vote', { detail: data });
    document.dispatchEvent(voteEvent);
  }
</script>
