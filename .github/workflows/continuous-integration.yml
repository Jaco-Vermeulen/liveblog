name: Liveblog CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    env:
      CI: true
      SYNDICATION_VALIDATE_AUTH: 0
      MAIL_SERVER: 'localhost'
      MAIL_PORT: 2225
      MAIL_USERNAME: __EMPTY__
      MAIL_PASSWORD: __EMPTY__
      MAIL_USE_TLS: 0
      MAIL_USE_SSL: 0
      MAIL_DEBUG: 1
      MAIL_SUPPRESS_SEND: true
      IFRAMELY_KEY: ${{ secrets.IFRAMELY_KEY }}
      SUPERDESK_URL: 'http://localhost:5000/api'
      SUPERDESK_CLIENT_URL: 'http://localhost:9000'
      WEB_CONCURRENCY: 3
      WEB_TIMEOUT: 8
      SUPERDESK_TESTING: true
      MARKETPLACE: true
      SYNDICATION: true

    services:
      mongodb:
        image: mongo:3.4.23
        ports:
          - 27017:27017
      redis:
        image: redis
        ports:
          - 6379:6379
      elasticsearch:
        image: liveblog3/elasticsearch:1.7.2
        ports:
          - 9200:9200

    steps:
    - uses: actions/checkout@v3

    - name: Cache Conda environment
      uses: actions/cache@v3
      with:
        path: /usr/share/miniconda/envs/liveblog-ci-env
        key: ${{ runner.os }}-conda-${{ hashFiles('environment.yml') }}
        restore-keys: |
          ${{ runner.os }}-conda-

    - name: Setup Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: liveblog-ci-env
        environment-file: environment.yml
        python-version: 3.6
        auto-activate-base: false

    - name: Cache Node.js modules (client_web2)
      uses: actions/cache@v3
      with:
        path: |
          ~/.npm
          client_web2/node_modules
        key: ${{ runner.os }}-node-web2-${{ hashFiles('client_web2/package-lock.json', 'client_web2/package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-web2-

    - name: Cache Python packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          /usr/share/miniconda/envs/liveblog-ci-env/lib/python3.6/site-packages
        key: ${{ runner.os }}-pip-${{ hashFiles('server/dev-requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies and run tests
      working-directory: ./server
      run: |
        pip install 'pip<=20.2.3'
        pip install 'setuptools<50'
        pip install -r dev-requirements.txt
        pytest --ignore=src/ --disable-pytest-warnings -v
        behave --format progress2 --logging-level ERROR

    - name: Setup Node 20 for client_web2
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: client_web2/package-lock.json

    - name: Install client_web2 dependencies, lint, and unit tests
      working-directory: ./client_web2
      run: |
        npm config set loglevel warn
        npm ci
        npm run lint
        npm test

    - name: Initialize app data
      working-directory: ./server
      run: |
        python app_init_elastic.py
        python manage.py app:initialize_data
        python manage.py users:create -u admin -p admin -fn Admin -ln Admin -e 'admin@example.com' --admin
        python manage.py register_local_themes
        python manage.py register_bloglist

    - name: Start backend services
      working-directory: ./server
      run: |
        (nohup honcho start &)
        (nohup sudo python -m smtpd -n -c DebuggingServer localhost:2225 &)

    - name: Build and serve client_web2
      working-directory: ./client_web2
      env:
        VITE_LIVEBLOG_API_URL: http://localhost:5000/api
        VITE_LIVEBLOG_WS_URL: ws://localhost:5100
        CLIENT_PORT: '9000'
      run: |
        npm run build
        (nohup npm run preview -- --host 0.0.0.0 --port 9000 &)
        for i in $(seq 1 60); do
          if curl -sf -o /dev/null http://localhost:9000/; then
            echo "client_web2 preview ready"
            break
          fi
          sleep 2
        done

    - name: Wait for API and run auth smoke
      run: |
        for i in $(seq 1 60); do
          if curl -sf -o /dev/null http://localhost:5000/api/; then
            echo "API ready"
            break
          fi
          sleep 2
        done
        node client_web2/scripts/smoke-auth-no-password.mjs
      env:
        SUPERDESK_URL: 'http://localhost:5000/api'

    - name: Install Playwright dependencies
      working-directory: ./client_web2
      run: npx playwright install chromium --with-deps

    - name: Run Playwright e2e tests (client_web2)
      working-directory: ./client_web2
      env:
        PLAYWRIGHT_BASE_URL: http://localhost:9000
        PLAYWRIGHT_SKIP_WEBSERVER: '1'
      run: npm run test:e2e
