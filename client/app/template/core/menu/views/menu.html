<div class="m-app-chrome">
  <div
    id="top-menu"
    ng-class="{'menu-open': flags.menu, 'test-environment': isTestEnvironment}"
    data-text="{{environmentName}}"
  >
    <div class="nav pull-left m-top-nav__start">
      <button
        type="button"
        class="collapse-nav m-hamburger pull-left"
        ng-click="toggleMenu()"
        ng-attr-aria-expanded="{{ flags.menu }}"
        aria-controls="main-menu"
        aria-label="{{ 'Menu' | translate }}"
      >
        <span class="m-hamburger__box" aria-hidden="true">
          <span class="m-hamburger__bar"></span>
          <span class="m-hamburger__bar"></span>
          <span class="m-hamburger__bar"></span>
        </span>
      </button>

      <a class="m-top-nav__brand" href="#/liveblog" title="Maroela Media">
        <img src="images/maroela-logo.svg" alt="Maroela Media" width="120" height="32" />
      </a>

      <p
        class="sd-top-menu__header m-top-nav__title"
        ng-if="currentRoute.category !== 'superdesk.core.menu.settings'"
        ng-hide="currentRoute.topTemplateUrl"
      >{{ currentRoute.label | translate}}</p>
      <p
        class="sd-top-menu__header m-top-nav__title"
        ng-if="currentRoute.category === 'superdesk.core.menu.settings'"
        ng-hide="currentRoute.topTemplateUrl"
      >{{ "Settings" | translate}}</p>
      <div class="top-nav pull-left" ng-include="currentRoute.topTemplateUrl"></div>
    </div>

    <div class="nav pull-right m-top-nav__end">
      <button class="current-user pull-right" ng-click="toggleNotifications()" aria-label="{{ 'Notifications' | translate }}">
        <span id="unread-count" class="badge badge--primary" ng-show="notifications.unread">{{ notifications.unread }}</span>
        <figure class="avatar">
          <img sd-user-avatar data-user="currentUser" alt="{{currentUser.display_name || currentUser.username }}">
        </figure>
      </button>
      <button ng-if="privileges.feature_preview" ng-click="toggleBeta()" class="beta-switch pull-right">
        <span class="stable" ng-hide="beta" title="{{ :: 'Switch to feature preview' | translate }}">stable</span>
        <span class="beta" ng-show="beta" sd-tooltip="{{ :: 'Turn off feature preview' | translate }}" flow="down">feature preview</span>
      </button>
    </div>
  </div>

  <div
    class="m-nav-backdrop"
    ng-class="{'is-visible': flags.menu}"
    ng-click="toggleMenu()"
    aria-hidden="true"
  ></div>

  <div id="side-menu" ng-class="{'menu-open': flags.menu}" ng-include="currentRoute.sideTemplateUrl"></div>

  <nav id="main-menu" ng-class="{'menu-open': flags.menu}" aria-label="{{ 'Main navigation' | translate }}">
    <div class="header m-menu-brand">
      <img src="images/maroela-logo.svg" alt="Maroela Media" class="m-menu-brand__logo" width="140" height="40" />
      <button
        type="button"
        class="m-menu-close"
        ng-click="toggleMenu()"
        aria-label="{{ 'Close menu' | translate }}"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="content">
      <ul>
        <li ng-repeat="item in menu | filter:{ adminTools: false } | orderBy:'priority'" ng-class="{active: item.isActive}">
          <a ng-href="#{{ :: item.href }}" title="{{ :: item.description | translate }}">{{ :: item.label | translate }}</a>
        </li>
        <li class="main-menu_group-header" translate ng-if="adminOptions.length > 0">Admin tools</li>
        <li ng-repeat="item in menu | filter:{ adminTools: true } | orderBy:'priority' as adminOptions" ng-class="{active: item.isActive}">
          <a ng-href="#{{ :: item.href }}" title="{{ :: item.description | translate }}">
            {{ :: item.label | translate }}
            <sup class="btn-toggle-label" ng-if="item.betaMark">Beta</sup>
          </a>
        </li>
        <li ng-if="feedback_url" class="main-menu_group-header" translate>Feedback</li>
        <li ng-if="feedback_url">
          <a ng-href="{{ feedback_url }}" target="_blank" rel="noopener">Feedback/Suggestions</a>
        </li>
      </ul>
    </div>
    <div class="footer m-menu-footer">
      <span class="about"><a ng-click="aboutModal = aboutModal ? false: true">Oor Regstreekse blog</a></span>
    </div>
  </nav>

  <div sd-about data-active="aboutActive"></div>
</div>
